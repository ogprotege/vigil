name: apple

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vigilkit:
    name: Build and test Vigil
    # Apple builds require a macOS runner.
    # macos-15+: current XcodeGen emits project format 77, which needs
    # Xcode >= 16 to open (macos-14 tops out at 15.4).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate documentation
        run: scripts/check-docs.sh
      - name: Reject tracked signing secrets
        run: |
          if git ls-files | grep -E '\.(p12|p8|mobileprovision)$'; then
            echo "Signing credentials or profiles must not be tracked."
            exit 1
          fi
      - name: Swift version
        run: swift --version
      - name: VigilKit tests
        run: swift test --package-path packages/VigilKit
      # Compile-check the app targets on every push.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: apps/apple
      - name: Build app (iOS Simulator)
        run: >
          xcodebuild -project Vigil.xcodeproj -scheme Vigil
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/apple
      - name: Test app (iOS Simulator)
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available \
            | awk -F '[()]' '/^[[:space:]]+iPhone/ { print $2; exit }')
          test -n "$DEVICE_UDID"
          echo "Testing on simulator: $DEVICE_UDID"
          xcodebuild -project Vigil.xcodeproj -scheme Vigil \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            test CODE_SIGNING_ALLOWED=NO
        working-directory: apps/apple
      - name: Validate property lists and entitlements
        run: |
          plutil -lint Vigil/Info.plist VigilWidgets/Info.plist
          plutil -lint Vigil/Resources/PrivacyInfo.xcprivacy VigilWidgets/PrivacyInfo.xcprivacy
          plutil -lint Entitlements/*.entitlements
        working-directory: apps/apple
