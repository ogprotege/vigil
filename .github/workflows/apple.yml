name: apple

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  vigilkit:
    # macOS runners are free on public repos but billed at 10x minutes on
    # private ones — see docs/mac-checklist.md notes.
    # macos-15+: current XcodeGen emits project format 77, which needs
    # Xcode >= 16 to open (macos-14 tops out at 15.4).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: VigilKit tests
        run: swift test --package-path packages/VigilKit
      # M4: compile-check the app targets on every push.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: apps/apple
      - name: Build app (iOS Simulator)
        run: >
          xcodebuild -project Vigil.xcodeproj -scheme Vigil
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/apple
