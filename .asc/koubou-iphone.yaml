defaults:
  background:
    colors:
    - '#0B1020'
    - '#18243D'
    direction: 160
    type: linear
project:
  device: iPhone 17 Pro Max - Silver - Portrait
  name: Vigil 1.0 iPhone App Store screenshots
  output_dir: ../screenshots/framed/iphone/en-US
  output_size: iPhone6_9
screenshots:
  01-home-dark:
    content:
    - color: '#65D6B4'
      content: Your AI limits, ranked
      position: [50%, 8%]
      size: 64
      type: text
      weight: bold
    - color: '#D8E2F0'
      content: See the tightest quota first.
      position: [50%, 13%]
      size: 34
      type: text
    - asset: ../screenshots/raw/iphone/en-US/01-home-dark.png
      frame: true
      position: [50%, 63%]
      scale: 0.73
      type: image
