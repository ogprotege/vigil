# XcodeGen manifest (ADR-0002). Generate the project on a Mac:
#   brew install xcodegen
#   cd apps/apple && xcodegen generate && open Vigil.xcodeproj
#
# Targets:
#   Vigil        — iOS SwiftUI app (iOS 17); depends on the local VigilKit
#                  package. App Group + shared Keychain group let the widget
#                  process share SnapshotStore + the polling ledger.
#   VigilWidgets — iOS widget extension (systemSmall + accessoryCircular).
name: Vigil
options:
  bundleIdPrefix: app.vigil
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
packages:
  VigilKit:
    path: ../../packages/VigilKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 18
    MARKETING_VERSION: 0.15.0
    # Local simulator builds need no team. Distribution settings below provide
    # the team and profiles for device and App Store builds.
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      # Run Xcode's product validation during every distribution archive, not
      # only when an operator remembers a command-line override.
      VALIDATE_PRODUCT: YES

targets:
  Vigil:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Vigil
    dependencies:
      - package: VigilKit
      - target: VigilWidgets
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vigil.app
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Device/App Store builds use manual distribution signing (the team
        # has no registered devices, so automatic development signing cannot
        # mint profiles). Simulator builds stay signing-free.
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Vigil AppStore
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 4KBWH9KYSD
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Entitlements/Vigil-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Entitlements/Vigil-iOS.entitlements
    info:
      path: Vigil/Info.plist
      properties:
        CFBundleDisplayName: Vigil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VigilKeychainAccessGroup: $(AppIdentifierPrefix)app.vigil.shared
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        NSFaceIDUsageDescription: Face ID locks the app so only you can see your accounts and usage.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - app.vigil.refresh
        LSApplicationCategoryType: public.app-category.utilities
    scheme:
      testTargets:
        - VigilTests
        - VigilUITests
      gatherCoverageData: true

  VigilTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: VigilTests
    dependencies:
      - target: Vigil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vigil.tests
        GENERATE_INFOPLIST_FILE: YES

  VigilUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: VigilUITests
    dependencies:
      - target: Vigil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vigil.uitests
        GENERATE_INFOPLIST_FILE: YES

  VigilWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      # VigilWidgets/ also carries PrivacyInfo.xcprivacy — XcodeGen places it
      # in the extension's resources phase, mirroring how the app target picks
      # up Vigil/Resources/PrivacyInfo.xcprivacy (both targets compile
      # required-reason API users: file timestamps + UserDefaults).
      - path: VigilWidgets
      # Shared with the app target: container resolution + the gated fetch
      # pipeline, so the widget obeys the same ledger.
      - path: Vigil/Support/SharedContainer.swift
      - path: Vigil/Support/SnapshotFreshness.swift
      - path: Vigil/Support/UsageService.swift
      - path: Vigil/Support/UsagePresentation.swift
    dependencies:
      - package: VigilKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vigil.app.widgets
        CODE_SIGN_ENTITLEMENTS: Entitlements/VigilWidgets.entitlements
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": VigilWidgets AppStore
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 4KBWH9KYSD
    info:
      path: VigilWidgets/Info.plist
      properties:
        CFBundleDisplayName: Vigil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VigilKeychainAccessGroup: $(AppIdentifierPrefix)app.vigil.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
