# XcodeGen manifest (ADR-0002). Generate the project on a Mac:
#   brew install xcodegen
#   cd apps/apple && xcodegen generate && open Vigil.xcodeproj
#
# Targets:
#   Vigil        — multiplatform SwiftUI app (iOS 17 / macOS 14); depends on the
#                  local VigilKit package. App Group + shared Keychain group so
#                  the widget process shares SnapshotStore + the polling ledger.
#   VigilWidgets — iOS widget extension (systemSmall + accessoryCircular).
name: Vigil
options:
  bundleIdPrefix: app.vigil
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.4"
packages:
  VigilKit:
    path: ../../packages/VigilKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 10
    MARKETING_VERSION: 0.13.0
    # Local/simulator builds need no team; device runs set DEVELOPMENT_TEAM in
    # Xcode's Signing pane (mac-checklist §M4 step 7).
    CODE_SIGN_STYLE: Automatic

targets:
  Vigil:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Vigil
    dependencies:
      - package: VigilKit
      - target: VigilWidgets
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vigil.app
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Device/App Store builds use manual distribution signing (the team
        # has no registered devices, so automatic development signing cannot
        # mint profiles). Simulator + macOS builds stay signing-free.
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Vigil AppStore
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 4KBWH9KYSD
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Entitlements/Vigil-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Entitlements/Vigil-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Entitlements/Vigil-macOS.entitlements
    info:
      path: Vigil/Info.plist
      properties:
        CFBundleDisplayName: Vigil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VigilKeychainAccessGroup: $(AppIdentifierPrefix)app.vigil.shared
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        NSCameraUsageDescription: Vigil uses the camera only to scan the QR link codes shown by `npx vigil-link` on your computer. Nothing is recorded or stored.
        NSFaceIDUsageDescription: Face ID locks the app so only you can see your accounts and usage.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - app.vigil.refresh
        CFBundleURLTypes:
          - CFBundleURLName: app.vigil.link
            CFBundleURLSchemes: [vigil1]
        LSApplicationCategoryType: public.app-category.utilities
    scheme:
      testTargets:
        - VigilTests
      gatherCoverageData: true

  VigilTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: VigilTests
    dependencies:
      - target: Vigil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vigil.tests
        GENERATE_INFOPLIST_FILE: YES
        # Keep iOS app-hosted. On macOS, run the bundle under xctest instead
        # of LaunchServices so CI does not need a signed GUI test host.
        "TEST_HOST[sdk=macosx*]": ""
        "BUNDLE_LOADER[sdk=macosx*]": ""
        "OTHER_LDFLAGS[sdk=macosx*]": "$(inherited) $(BUILT_PRODUCTS_DIR)/Vigil.app/Contents/MacOS/Vigil.debug.dylib"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) $(BUILT_PRODUCTS_DIR)/Vigil.app/Contents/MacOS"

  VigilWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      # VigilWidgets/ also carries PrivacyInfo.xcprivacy — XcodeGen places it
      # in the extension's resources phase, mirroring how the app target picks
      # up Vigil/Resources/PrivacyInfo.xcprivacy (both targets compile
      # required-reason API users: file timestamps + UserDefaults).
      - path: VigilWidgets
      # Shared with the app target: container resolution + the gated fetch
      # pipeline, so the widget obeys the same ledger.
      - path: Vigil/Support/SharedContainer.swift
      - path: Vigil/Support/SnapshotFreshness.swift
      - path: Vigil/Support/UsageService.swift
      - path: Vigil/Support/UsagePresentation.swift
    dependencies:
      - package: VigilKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vigil.app.widgets
        CODE_SIGN_ENTITLEMENTS: Entitlements/VigilWidgets.entitlements
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": VigilWidgets AppStore
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 4KBWH9KYSD
    info:
      path: VigilWidgets/Info.plist
      properties:
        CFBundleDisplayName: Vigil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VigilKeychainAccessGroup: $(AppIdentifierPrefix)app.vigil.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
